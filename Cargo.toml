[package]
name = "lru-cache"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lru"
path = "src/bin/client/main.rs"

[[bin]]
name = "lru-daemon"
path = "src/bin/daemon/main.rs"

[dependencies]
anyhow = "^1"
byte-unit = "^5"
inotify = "^0.11"
nix = { version = "^0.31", features = ["event", "signal"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
supershorty = "^0.3"
thiserror = "^2"
toml = "^1"
twox-hash = { version = "^2", default-features = false, features = [
    "std",
    "xxhash3_64",
] }
walkdir = "^2"

[dev-dependencies]
tempfile = "^3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
